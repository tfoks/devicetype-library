  G6 Monitored Input (MI) PDU, label model PP11032-0016
  1-Phase, 32A, 230V, IEC 60309 2P+E 6h 32A (IP44) inlet, 7.4 kVA
  36x C13 + 6x C19 outlets across 2 circuit breakers (B1: outlets 1-21, B2: outlets 22-42)
  C19 positions: 7, 14, 21, 28, 35, 42. All others C13.
  Aggregate input monitoring only. Two RJ45 network ports for uplink and daisy chaining.
  NOTE: Do NOT set maximum_draw on the power port - this prevents NetBox from
  calculating downstream device draw propagation (NetBox issue #8177).

